<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="color-scheme" content="dark">
  <title>HEARTHWARD · Console of Verifiable Claims</title>
  <link rel="stylesheet" href="console.css">
</head>
<body>
  <noscript><p class="noscript">This console verifies hashes and signatures in your browser, so it needs JavaScript. Nothing is sent anywhere.</p></noscript>
  <header id="top">
    <div id="brand">HEARTHWARD</div>
    <p id="sentence">Helps people who live alone resist scams. Each claim opens into its evidence, then the bytes behind it, then a way for you to check it.</p>
    <div id="synthetic" title="Ring and Bee are synthetic-only; the data comes from the reference simulator, seed 7">SYNTHETIC DEMO DATA · ORRERY SEED 7</div>
    <button id="inspector-toggle" class="btn" data-action="inspector-toggle" aria-controls="inspector">Inspector <kbd>I</kbd></button>
  </header>
  <nav id="nav" aria-label="Claims"></nav>
  <div id="layout">
    <main id="claim" aria-live="polite">
      <header id="claim-head"></header>
      <section id="claim-hero" aria-label="Evidence"></section>
      <section id="claim-tryit" aria-label="Try it"></section>
      <section id="claim-proof" aria-label="Proof"></section>
    </main>
    <aside id="inspector" aria-label="Inspector"></aside>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
