[project]
name = "hearthward"
version = "0.1.0"
description = "Scam resistance for people who live alone: an Alexa+ MCP add-on over a bitemporal, hash-chained event ledger."
readme = "docs/master_blueprint.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.3.0",
    "boto3",
    "jsonschema>=4.20",
    "rfc8785",
    "pyjwt>=2.8",
    "cryptography",
    "starlette",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-timeout",
    "hypothesis",
    "moto[dynamodb]",
    "ruff",
    "aws-cdk-lib",
    "constructs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hearthward"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tools"]
addopts = "--strict-markers --strict-config -ra"
timeout = 300
markers = [
    "gate_g1: contracts and ingest (HW-JCS, envelope, ledger, Ring and Bee ingest)",
    "gate_g2: MCP server and OAuth facade",
    "gate_g3: deployed and linked",
    "gate_g4: causal engine and decision core",
    "gate_g5: broker and intervention ladder",
    "gate_g6: integrity, attestation and web",
]

[tool.ruff]
line-length = 120
target-version = "py312"
